# The profile source belongs to this repository. Validation never rewrites or publishes it.
name: profile

on:
  push:
    branches: [main]
    paths:
      - README.md
      - assets/**
      - scripts/validate-profile.py
      - .github/workflows/profile.yml
  pull_request:
    paths:
      - README.md
      - assets/**
      - scripts/validate-profile.py
      - .github/workflows/profile.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: profile-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout profile source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate profile source and local references
        run: python3 scripts/validate-profile.py
