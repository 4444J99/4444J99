# The profile source belongs to this repository. Validation never rewrites or publishes it.
name: profile

on:
  push:
    branches: [main]
    paths:
      - README.md
      - assets/**
      - requirements-profile.txt
      - scripts/validate-profile.py
      - tests/**
      - .github/workflows/profile.yml
  pull_request:
    paths:
      - README.md
      - assets/**
      - requirements-profile.txt
      - scripts/validate-profile.py
      - tests/**
      - .github/workflows/profile.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # Keep the former publisher's group so replacement runs cancel it if still in flight.
  group: profile
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout profile source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned profile validation dependencies
        run: python3 -m pip install --requirement requirements-profile.txt

      - name: Test Markdown destination validation
        run: python3 -m unittest discover -s tests -v

      - name: Validate profile source and local file targets
        run: python3 scripts/validate-profile.py
